  <style>
    .text-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* Shifts container back by half its own width/height */
    
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-size: 3vw;
    align-items: center;
    text-align: center;
    width: 80%; /* Prevents text from breaking weirdly on small screens */
    color: white; /* Optional: makes text readable over dark images */
    text-shadow: 0 2px 10px rgba(0,0,0,0.5); /* Optional: adds readability contrast */
}
 
.image{
    width: 100vw;
    margin-top: 2vh;
    visibility: hidden;
    transform: translateY(100px);
    opacity: 0;
    transition: opacity 2s, transform 2s;    }
.image.active{
opacity: 1;transform: translateY(0px);
position: absolute;
visibility: visible;
top: 0;
left: 0;
}
  </style>
<script> 
    let index=0;
    ff();
    function ff() {
        let bigimage=document.querySelectorAll(".image");
        bigimage[index].classList.remove("active");
        index++;
        index=index%bigimage.length;
        bigimage[index].classList.add("active");
        setTimeout(ff,4000);
    }
</script>
