<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Animation & Hover Test</title>
    
    <style>
        /* --- YOUR UTILITY CSS CLASS SYSTEM --- */
        .df{display: flex;}
        .jcc{justify-content: center;}
        .jcsb{justify-content: space-between;}
        .aic{align-items: center;}
        .air{align-items: right;}
        .ail{align-items: left;}
        .asc{align-self: center;}
        .fdc{flex-direction: column;}
        .dn{display: none;}
        .pf{position: fixed;}
        .fr{float:right;}
        .fl{float:left;}
        .hmc{height: max-content;}
        .wmc{width: max-content;}
        .w100{width: 100vw;}.w95{width: 95vw;}  .w90{width: 90%;}.w80{width: 80vw;}.w70{width: 70vw;} .w60{width: 60vw;} .w50{width: 50vw;} .w40{width: 40vw;} .w30{width: 30vw;} .w20{width: 20vw;} .w10{width: 10vw;} .w5{width: 5vw;}
        .h95{height: 95vh;}  .h90{height: 90vh;}.h80{height: 80vh;}.h70{height: 70vh;} .h60{height: 60vh;} .h50{height: 50vh;} .h40{height: 40vh;} .h30{height: 30vh;} .h20{height: 20vh;} .h10{height: 10vh;} .h5{height: 5vh;}
        .hminc{height: min-content;} 
        .wminc{width: min-content;}
        .cor{color: orangered;}
        .h:hover{color: green;}
        *{border-radius: 0.16em;}
        .ma{margin: 0 auto;}
        .tac{text-align: center;}
        .tal{text-align: left;}
        .tar{text-align: right;}
        .tdn{text-decoration: none;}
        input::placeholder{text-align: left;}
        .cg{color: green;}
        .bgcb{background-color: black;}
        .fwb{font-weight: bold;}.fwi{font-weight:italic;}
        .fss{font-size: small;} .fsm{font-size: medium;} .fsl{font-size: large;} .fsxl{font-size: x-large;} .fsxxl{font-size: xx-large;}
        .mt{margin-top: 1em;} .mb{margin-bottom: 1em;} .ml{margin-left: 1em;} .mr{margin-right: 1em;}

        /* --- BODY STYLING --- */
        body {
            background-color: #0b0f19; /* Dark background to see the cyan glow */
            margin: 0;
            padding-bottom: 50vh; /* Adds extra scrolling space at the bottom */
        }

        /* --- BUTTON BASE STYLES --- */
        button {
            width: 150px;
            padding: 0.8rem 1.5rem;
            background-color: #ffffff;
            border:#11d8f2 solid 2px;
            border-radius: 8px;
            color: #0b0f19;
            font-size: 1.1rem;
            box-shadow: 0 0 55px rgb(17, 194, 218);
            margin: 2rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease; /* Adjusted transition for smoother hover responsiveness */
        }

        /* --- SCROLL REVEAL STATES --- */
        .reveal-container .sa {
            opacity: 0;
            transform: translateY(60px); 
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); /* Reduced from 4s to 0.8s to prevent it fighting your hover animation */
        }

        .reveal-container.active .sa {
            opacity: 1;
            transform: translateY(0); 
        }

        /* --- FIXED HOVER & ACTIVE STATES (Combats specificity conflicts) --- */
        button:hover,
        .reveal-container.active .sa:hover {
            transform: translateY(0) scale(1.5); 
            box-shadow: 0 0 75px rgb(17, 194, 218);
        } 

        button:active,
        .reveal-container.active .sa:active {
            transform: translateY(0) scale(0.95); 
            box-shadow: 0 0 35px rgb(17, 194, 218);
        }

        /* Temporary styling spacer just to force a scrollbar so you can test the scroll logic */
        .spacer {
            height: 70vh; 
            color: #fff;
            display: flex;
            align-items: center;
            font-family: sans-serif;
            opacity: 0.3;
        }
    </style>
</head>
<body class="df jcc fdc aic">

    <div class="spacer">
        <h2>↓ Scroll down to trigger animations ↓</h2>
    </div>

    <div class="reveal-container">
         <button class="sa">Static</button>
    </div>

    <div class="reveal-container">
         <button class="sa">Button 1</button>
    </div>
    
    <div class="reveal-container">
         <button class="sa">Button 2</button>
    </div>
    
    <div class="reveal-container">
         <button class="sa">Button 3</button>
    </div>
<div class="reveal-container">
         <button class="sa">Static</button>
    </div>

    <div class="reveal-container">
         <button class="sa">Button 1</button>
    </div>
    
    <div class="reveal-container">
         <button class="sa">Button 2</button>
    </div>
    
    <div class="reveal-container">
         <button class="sa">Button 3</button>
    </div><div class="reveal-container">
         <button class="sa">Static</button>
    </div>

    <div class="reveal-container">
         <button class="sa">Button 1</button>
    </div>
    
    <div class="reveal-container">
         <button class="sa">Button 2</button>
    </div>
    
    <div class="reveal-container">
         <button class="sa">Button 3</button>
    </div><div class="reveal-container">
         <button class="sa">Static</button>
    </div>

    <div class="reveal-container">
         <button class="sa">Button 1</button>
    </div>
    
    <div class="reveal-container">
         <button class="sa">Button 2</button>
    </div>
    
    <div class="reveal-container">
         <button class="sa">Button 3</button>
    </div>
    <script>
        const revealContainers = document.querySelectorAll('.reveal-container');

        const observerOptions = {
            root: null,         
            threshold: 0.1,    // Triggers when 10% of the container is visible
            rootMargin: "0px"   
        };

        const scrollObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                } else {
                    entry.target.classList.remove('active');
                }
            });
        }, observerOptions);

        revealContainers.forEach(container => {
            scrollObserver.observe(container);
        });
    </script>
</body>
</html>
