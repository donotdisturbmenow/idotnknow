<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Webpage</title>
    <link rel="stylesheet" href="s.css">
    <script defer>
document.addEventListener("DOMContentLoaded", function() {
    const img = document.getElementById("searchbutton");
    const input = document.getElementById("searchinput");

    img.addEventListener("click", function() {
        if (input.style.transform === "scale(0)") {
            input.style.transform = "scale(1)";
        } else {
            input.style.transform = "scale(0)";
        }
    });
});

</script>
</head>

<style>

 a{

.mainfirstsubcontainer2 img{

/* Base styles to ensure smooth animations */
 a,  img {
  display: inline-block; 
  transition: transform 0.3s ease, box-shadow 0.3s ease; 
  transform-origin: center; 
}

/* Hover State: Huge 360-degree shadow and 1.5x zoom */
 a:hover,     img:hover {
  background: #fff;
  color: #e03308;
  
  /* Zoom 1.5x */
  transform: scale(1.5); 
  
  /* Huge, even shadow around everywhere: 
     0 offset X, 0 offset Y, 30px blur, 10px spread */
  box-shadow: 0 0 30px 10px rgba(23, 105, 137, 0.2); 
  
  position: relative;
  z-index: 10; 
}

/* Click/Active State: Button "pressed" feel */
 a:active,  img:active {
  /* Slightly drops the zoom to look pressed */
  transform: scale(1.35); 
  
  /* Shrinks the shadow back down tightly around the object */
  box-shadow: 0 0 15px 2px rgba(68, 200, 233, 0.25); 
}


</style>
